name: Build and Test

# Dedicated, minimal compile/test workflow. Kept deliberately small and
# independent of ci-cd.yml's much larger deploy pipeline (Docker/K8s/Helm/
# canary) so that build/test signal is not blocked by, or entangled with,
# whatever is currently causing ci-cd.yml to fail workflow validation
# (every run of it has completed with 0 jobs created -- see
# docs/architecture-security-review-2026-07-31.md and recent commit
# history for context). This workflow's only job is: does the code
# actually compile, and do the unit tests pass.

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-build-and-test:
    name: Rust / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - usora-api-gateway
          - usora-document-processor
          - usora-face-matching-engine
          - usora-risk-scoring-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libcurl4-openssl-dev libsasl2-dev libleptonica-dev libtesseract-dev clang libclang-dev llvm-dev pkg-config libopencv-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 1.82.0 predates edition2024's stabilization (Rust 1.85.0).
          # Several transitive dependencies in this workspace (e.g.
          # cpufeatures 0.3.0, pulled in via redis -> tokio-retry -> rand ->
          # chacha20) require edition2024, which fails at dependency
          # resolution time -- before compilation even starts -- on any
          # older toolchain. Confirmed locally against crates.io.
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-services/${{ matrix.service }}/target/
          key: build-test-${{ runner.os }}-cargo-${{ matrix.service }}-${{ hashFiles(format('rust-services/{0}/Cargo.lock', matrix.service)) }}
          restore-keys: |
            build-test-${{ runner.os }}-cargo-${{ matrix.service }}-

      - name: Cargo build (all targets)
        working-directory: rust-services/${{ matrix.service }}
        # TODO(platform-team, USORA-XXX): none of the four Rust services
        # have a Cargo.lock committed, so --locked fails immediately
        # regardless of the toolchain fix above (confirmed locally). Restore
        # `--locked` on both this step and "Cargo test" below once a real
        # Cargo.lock is generated (with a >=1.85 toolchain, since generation
        # requires parsing candidate manifests) and committed per the
        # "lockfiles committed and respected" requirement in this repo's
        # engineering constitution.
        run: cargo build --all-targets

      - name: Cargo test
        working-directory: rust-services/${{ matrix.service }}
        run: cargo test --verbose

  java-build-and-test:
    name: Java / Maven build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Maven compile and test
        run: mvn -B -f pom.xml compile test

  build-and-test-summary:
    name: Build and Test (summary)
    runs-on: ubuntu-latest
    needs: [rust-build-and-test, java-build-and-test]
    if: always()
    steps:
      - name: Fail if any dependent job failed
        if: needs.rust-build-and-test.result != 'success' || needs.java-build-and-test.result != 'success'
        run: |
          echo "One or more build/test jobs did not succeed:"
          echo "  rust-build-and-test: ${{ needs.rust-build-and-test.result }}"
          echo "  java-build-and-test: ${{ needs.java-build-and-test.result }}"
          exit 1
