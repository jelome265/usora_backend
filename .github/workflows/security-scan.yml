name: Security Scan

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write

env:
  DOCKER_REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml
          build-mode: manual

      - name: Build Java Services for CodeQL
        run: |
          mvn clean compile -DskipTests -B -f pom.xml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: /language:${{ matrix.language }}

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb bookworm main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Trivy Filesystem Scan
        # F-014: previously --exit-code 0 with continue-on-error: true,
        # meaning a CRITICAL/HIGH finding could never fail this job --
        # Trivy ran purely as an evidence collector. --exit-code 1 (the
        # default meaning of "found a match at this severity") now
        # actually fails this step; continue-on-error is removed from the
        # scan itself. .trivyignore supports time-bounded, reviewed
        # exceptions (remediation item 5) via Trivy's own native
        # ignore-file mechanism rather than a hand-rolled one.
        run: |
          trivy filesystem \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format sarif \
            --output trivy-fs-results.sarif \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --timeout 10m \
            .

      - name: Trivy Config Scan (IaC)
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format sarif \
            --output trivy-config-results.sarif \
            --ignorefile .trivyignore \
            --timeout 5m \
            infrastructure/

      - name: Upload Trivy SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
        continue-on-error: true

      - name: Upload Trivy Config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-iac
        continue-on-error: true

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: OWASP Dependency Check (Java)
        # F-014: previously `|| true` + continue-on-error: true completely
        # neutralized -DfailBuildOnCVSS=7, which was already correctly
        # configured to fail the Maven build on a CVSS>=7 finding -- the
        # scan was doing real policy evaluation and then having its
        # verdict thrown away. Removed both; a CVSS>=7 dependency finding
        # now actually fails this job.
        run: |
          mvn dependency-check:check \
            -DfailBuildOnCVSS=7 \
            -Dformat=JSON \
            -Dout=owasp-dependency-check.json \
            -q \
            -f pom.xml

      - name: Setup Rust
        if: always()
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install Cargo Audit
        if: always()
        run: cargo install cargo-audit --locked

      - name: Cargo Audit (Rust)
        if: always()
        # F-014: previously `2>/dev/null || true` on every iteration meant
        # a real vulnerability (cargo audit exits nonzero when one is
        # found) was silently discarded -- this ran purely as an evidence
        # collector. Now tracks a combined exit code across all four
        # services and fails the step if any of them found something,
        # while still writing every service's JSON report first so the
        # upload step below has something to attach regardless.
        run: |
          cd rust-services
          overall=0
          for service in usora-api-gateway usora-document-processor usora-face-matching-engine usora-risk-scoring-engine; do
            echo "::group::Cargo Audit: $service"
            (cd "$service" && cargo audit --json > "../../cargo-audit-$service.json")
            status=$?
            if [ $status -ne 0 ]; then
              echo "::error::cargo audit found a vulnerability in $service (exit $status)"
              overall=1
            fi
            echo "::endgroup::"
          done
          exit $overall

      - name: Upload OWASP Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check
          path: owasp-dependency-check.json
          if-no-files-found: ignore

      - name: Upload Cargo Audit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-reports
          path: cargo-audit-*.json
          if-no-files-found: ignore

  semgrep-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep Scan
        # F-014: previously `|| true` + continue-on-error: true
        # neutralized --error, which already makes Semgrep exit nonzero
        # when findings are present -- the scan was doing real policy
        # evaluation and then having its verdict thrown away. Removed
        # both; a real Semgrep finding now actually fails this job.
        run: |
          semgrep \
            --config=auto \
            --config=p/rust \
            --config=p/java \
            --config=p/owasp-top-ten \
            --config=p/command-injection \
            --config=p/secrets \
            --sarif \
            --output=semgrep-results.sarif \
            --error \
            --timeout=60 \
            --metrics=off \
            rust-services/ spring-boot-services/ shared/

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-sast
        continue-on-error: true

      - name: Generate Semgrep Summary
        if: always()
        run: |
          if [ -f semgrep-results.sarif ]; then
            python3 -c "
          import json
          with open('semgrep-results.sarif') as f:
              data = json.load(f)
          runs = data.get('runs', [])
          total = 0
          for run in runs:
              results = run.get('results', [])
              total += len(results)
              for r in results:
                  rule = r.get('ruleId', 'unknown')
                  level = r.get('level', 'warning')
                  loc = r.get('locations', [{}])[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', 'unknown')
                  msg = r.get('message', {}).get('text', '')
                  print(f'  [{level}] {rule}: {msg} ({loc})')
          print(f'Total findings: {total}')
          " 2>/dev/null || echo "No SARIF results to parse"
          else
            echo "No Semgrep results file found"
          fi

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # F-014: previously continue-on-error: true meant a real secret
        # leak (gitleaks-action exits nonzero on any leak found) could
        # never fail this job -- it ran purely as an evidence collector.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

      - name: Run TruffleHog
        # F-015: this was pinned to `@main` -- not even a version tag, a
        # floating branch reference that could resolve to any future
        # commit with no review at all, the opposite extreme of the
        # "immutable SHA pinning for security-sensitive actions"
        # remediation item calls for. Pinned to the current latest
        # release's commit SHA instead.
        #
        # This alone is NOT fully sufficient for this specific action: per
        # trufflesecurity/trufflehog#4857 (open upstream as of this
        # writing), the action's own `version` input defaults to pulling
        # `ghcr.io/trufflesecurity/trufflehog:latest` -- a mutable Docker
        # tag -- regardless of which action commit/tag is pinned here.
        # That issue explicitly cites CVE-2026-33634 (a March 2026 supply-
        # chain compromise of Trivy's own published scanner images) as
        # the concrete precedent for why this matters, not a theoretical
        # concern.
        #
        # Unrelated to the pinning fix: continue-on-error was already
        # removed from this step in F-014 (PR #174), so a verified secret
        # found here now fails the job -- noted since both changes touch
        # this same step.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified --results=verified
          # Pins the underlying scanner to a specific release tag rather
          # than the action's own "latest" default, per the upstream issue
          # above. This is not full digest pinning (that would need
          # ghcr.io/trufflesecurity/trufflehog:3.96.0's current image
          # digest, which needs verifying against the registry directly
          # at update time, not guessed at here) -- it at least stops an
          # untagged "latest" pull, and should be bumped deliberately
          # alongside the action pin above, not left to drift silently.
          version: "3.96.0"

      - name: Custom Secret Scan with grep
        if: always()
        # F-014: previously continue-on-error: true and no exit code ever
        # propagated even when PATTERNS matched -- this ran purely as an
        # evidence collector regardless of what it found. Now tracks
        # whether anything matched and fails the step if so.
        run: |
          echo "::group::Scanning for hardcoded secrets..."
          PATTERNS=(
            '-----BEGIN\s*(RSA|EC|DSA|OPENSSH|PGP)\s*PRIVATE\s*KEY-----'
            'AKIA[0-9A-Z]{16}'
            'sk_live_[0-9a-zA-Z]{24,}'
            'pk_live_[0-9a-zA-Z]{24,}'
            'ghp_[0-9a-zA-Z]{36}'
            'gho_[0-9a-zA-Z]{36}'
            'xox[baprs]-[0-9a-zA-Z-]{24,}'
            'AIza[0-9A-Za-z-_]{35}'
            '-----BEGIN CERTIFICATE-----'
          )
          found=0
          for pattern in "${PATTERNS[@]}"; do
            results=$(grep -rn "$pattern" --include="*.{rs,java,yml,yaml,toml,json,sh,sql,properties,xml}" . 2>/dev/null | grep -v ".git/" | grep -v "node_modules/" | grep -v "target/" || true)
            if [ -n "$results" ]; then
              echo "::error::Potential secret found matching pattern: $pattern"
              echo "$results" | head -20
              found=1
            fi
          done
          echo "::endgroup::"
          exit $found

      - name: Upload Secret Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: |
            gitleaks-report.*
            trufflehog-results.*
          if-no-files-found: ignore

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Maven License Check
        run: |
          mvn license:third-party-report -q -f pom.xml || true
          if [ -f spring-boot-services/target/site/third-party-report.html ]; then
            cp spring-boot-services/target/site/third-party-report.html maven-licenses.html
          fi
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cargo License Check
        run: |
          cargo install cargo-license --locked
          cd rust-services
          for service in usora-api-gateway usora-document-processor usora-face-matching-engine usora-risk-scoring-engine; do
            echo "::group::Licenses: $service"
            (cd "$service" && cargo license --json > ../../cargo-licenses-$service.json 2>/dev/null || true)
            echo "::endgroup::"
          done
        continue-on-error: true

      - name: Check Prohibited Licenses
        if: always()
        # F-014: previously continue-on-error: true and no exit code ever
        # propagated even when a prohibited license was found -- this was
        # evidence collection, not a policy gate, despite the (correctly
        # named) prohibited-license list existing. Now fails the step if
        # any prohibited license is detected in any service's report.
        run: |
          PROHIBITED=("GPL-3.0" "GPL-2.0" "AGPL-3.0" "AGPL-1.0" "SSPL-1.0")
          found=0
          for f in cargo-licenses-*.json; do
            if [ -f "$f" ]; then
              for lic in "${PROHIBITED[@]}"; do
                if grep -q "$lic" "$f" 2>/dev/null; then
                  echo "::error::$f contains prohibited license $lic"
                  found=1
                fi
              done
            fi
          done
          exit $found

      - name: Upload License Reports
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            maven-licenses.html
            cargo-licenses-*.json
          if-no-files-found: ignore

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb bookworm main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Base Images
        # F-014: previously --exit-code 0 with continue-on-error: true --
        # this ran purely as an evidence collector, same as the
        # filesystem/config Trivy scans above. Now uses the same
        # --exit-code 1 + .trivyignore pattern (upstream base-image CVEs
        # are common and often unfixed for a while, so time-bounded
        # exceptions matter here more than anywhere else in this file --
        # see .trivyignore).
        run: |
          overall=0
          IMAGES=(
            "rust:1.82-slim-bookworm"
            "eclipse-temurin:21-jdk-bookworm"
            "eclipse-temurin:21-jre-bookworm"
            "gcr.io/distroless/cc-debian12"
            "postgres:16"
            "redis:7-alpine"
            "confluentinc/cp-kafka:7.6"
            "minio/minio"
            "elasticsearch:8.12"
          )
          for image in "${IMAGES[@]}"; do
            echo "::group::Scanning $image"
            docker pull "$image" --quiet
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format sarif \
              --output "trivy-image-$(echo $image | tr '/:' '--').sarif" \
              --ignore-unfixed \
              --ignorefile .trivyignore \
              --timeout 5m \
              "$image"
            status=$?
            if [ $status -ne 0 ]; then
              echo "::error::HIGH/CRITICAL finding in base image $image"
              overall=1
            fi
            echo "::endgroup::"
          done
          exit $overall

      - name: Upload Container Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-results
          path: trivy-image-*.sarif
          if-no-files-found: ignore

  report:
    name: Aggregate Security Report
    runs-on: ubuntu-latest
    needs:
      - codeql-analysis
      - trivy-scan
      - dependency-check
      - semgrep-scan
      - secret-scan
      - license-check
      - container-scan
    if: always()
    timeout-minutes: 10
    env:
      SECURITY_SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-artifacts/
          merge-multiple: true

      - name: Generate Security Summary
        id: security-summary
        run: |
          SUMMARY="# Security Scan Summary
          ## Metadata
          - **Repository:** ${{ github.repository }}
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Date:** $(date -u)

          ## Scan Results

          | Scan | Status | Findings |
          |------|--------|---------|
          | CodeQL | ${{ needs.codeql-analysis.result }} | $(find security-artifacts/ -name '*.sarif' -path '*codeql*' 2>/dev/null | wc -l) reports |
          | Trivy Filesystem | ${{ needs.trivy-scan.result }} | $(find security-artifacts/ -name 'trivy-fs-*' 2>/dev/null | wc -l) reports |
          | Trivy Config | ${{ needs.trivy-scan.result }} | $(find security-artifacts/ -name 'trivy-config-*' 2>/dev/null | wc -l) reports |
          | OWASP DC | ${{ needs.dependency-check.result }} | $(find security-artifacts/ -name 'owasp-*' 2>/dev/null | wc -l) reports |
          | Cargo Audit | ${{ needs.dependency-check.result }} | $(find security-artifacts/ -name 'cargo-audit-*' 2>/dev/null | wc -l) reports |
          | Semgrep | ${{ needs.semgrep-scan.result }} | $(find security-artifacts/ -name 'semgrep-*' 2>/dev/null | wc -l) reports |
          | Secret Scan | ${{ needs.secret-scan.result }} | $(find security-artifacts/ -name 'gitleaks*' -o -name 'trufflehog*' 2>/dev/null | wc -l) reports |
          | License Check | ${{ needs.license-check.result }} | $(find security-artifacts/ -name '*license*' 2>/dev/null | wc -l) reports |
          | Container Scan | ${{ needs.container-scan.result }} | $(find security-artifacts/ -name 'trivy-image-*' 2>/dev/null | wc -l) reports |

          ## Overall Verdict
          "

          FAILURES=0
          for job in codeql-analysis trivy-scan dependency-check semgrep-scan secret-scan license-check container-scan; do
            STATUS=$(echo "${{ toJSON(needs) }}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('$job',{}).get('result','skipped'))" 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "failure" ]; then
              FAILURES=$((FAILURES + 1))
            fi
          done

          if [ $FAILURES -gt 0 ]; then
            SUMMARY="${SUMMARY}**❌ FAILED** - $FAILURES scan(s) reported issues requiring attention"
            echo "verdict=failure" >> $GITHUB_OUTPUT
          else
            SUMMARY="${SUMMARY}**✅ PASSED** - All security scans completed without critical findings"
            echo "verdict=success" >> $GITHUB_OUTPUT
          fi

          echo "$SUMMARY" > security-summary.md
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Security Summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md

      - name: Publish to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          sarif_file: security-artifacts/
          category: security-scan
        continue-on-error: true

      - name: Notify Security Team on Findings
        if: steps.security-summary.outputs.verdict == 'failure' && env.SECURITY_SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "text": "🔴 Security scan found issues in ${{ github.repository }}@${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🔴 Security Scan Issues Detected*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nVerdict: FAILED\n\nRun Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n*Action Required:* Please review the security scan results and address findings."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}

      - name: Notify on Success
        if: steps.security-summary.outputs.verdict == 'success' && env.SECURITY_SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "text": "🟢 Security scan passed for ${{ github.repository }}@${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🟢 Security Scan Passed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nVerdict: PASSED\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}

      - name: Enforce Aggregate Security Gate
        if: always()
        # F-014: this is the actual fix for the finding's central point --
        # "the aggregate report job uses if: always() and can complete
        # successfully even when CodeQL fails." Every step above this one
        # computes and reports a verdict, uploads artifacts, and notifies
        # Slack, but NOTHING previously made the report JOB ITSELF fail
        # when that verdict was "failure" -- the job (and therefore this
        # workflow's overall status, which is what a branch-protection
        # required-status-check actually looks at) could show green in
        # GitHub's UI while the printed verdict said "FAILED". This step
        # runs last (after notifications, so the team is still told either
        # way) and turns "failure" into a real, non-bypassable job failure.
        run: |
          if [ "${{ steps.security-summary.outputs.verdict }}" = "failure" ]; then
            echo "::error::One or more mandatory security controls failed -- see the Security Scan Summary artifact and the per-job results above. This gate does not pass until every mandatory control passes or has a documented, time-bounded exception (see .trivyignore)."
            exit 1
          fi
          echo "All mandatory security controls passed."
