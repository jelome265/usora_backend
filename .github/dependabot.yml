version: 2

updates:
  # Java / Spring Boot services — single multi-module Maven reactor rooted
  # at the top-level pom.xml (see <modules> there for the seven services).
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    groups:
      spring-boot:
        patterns:
          - "org.springframework*"
      testing:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"

  # Rust compute/gateway services — each has its own Cargo.toml/Cargo.lock,
  # there is no root Cargo workspace tying them together.
  - package-ecosystem: "cargo"
    directory: "/rust-services/usora-api-gateway"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "cargo"
    directory: "/rust-services/usora-document-processor"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "cargo"
    directory: "/rust-services/usora-face-matching-engine"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "cargo"
    directory: "/rust-services/usora-risk-scoring-engine"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  # Base images used by the shared Dockerfiles.
  - package-ecosystem: "docker"
    directory: "/infrastructure/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"

  # Actions referenced by our own workflows (actions/checkout, setup-java,
  # codeql-action, etc).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
