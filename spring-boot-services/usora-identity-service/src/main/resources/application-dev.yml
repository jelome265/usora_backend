server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/usora_identity_dev
    username: usora
    password: usora_dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

identity:
  opa:
    url: http://localhost:8181
    timeout_ms: 1000
  jwt:
    key_size: 1024

logging:
  level:
    com.usora: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4318
