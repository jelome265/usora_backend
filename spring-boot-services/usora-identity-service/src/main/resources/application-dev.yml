server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/usora_identity_dev
    username: usora
    password: usora_dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

identity:
  opa:
    url: http://localhost:8181
    timeout_ms: 1000
  jwt:
    key_size: 1024

# Dev-only values, never used in prod/staging -- those must come from a real
# secret store / the actual public issuer URL, and are required for startup
# (see SecurityConfig / DomainService fail-fast checks).
OAUTH_API_CLIENT_SECRET: dev-only-oauth-api-client-secret-not-for-production
OAUTH2_ISSUER: http://localhost:8081

logging:
  level:
    com.usora: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4318
