server:
  port: 8080

spring:
  application:
    name: usora-core-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://postgres.usora.svc.cluster.local:5432/usora
    username: ${DB_USERNAME:usora}
    password: ${DB_PASSWORD:usora}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.usora.svc.cluster.local:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      properties:
        enable:
          idempotence: true
    consumer:
      group-id: orchestrator-group
      auto-offset-reset: earliest
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:redis.usora.svc.cluster.local}
      port: 6379
      database: 0
      timeout: 2000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://identity.usora.svc.cluster.local:8080/oauth2/jwks}

usora:
  security:
    encryption-key: ${ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAA==}
    jwk-set-uri: ${JWK_SET_URI:http://identity.usora.svc.cluster.local:8080/oauth2/jwks}
  kafka:
    topics:
      verification-events: verification.events
      case-events: case.events
  grpc:
    server:
      port: 9090
      max-inbound-message-size: 4194304
  compute:
    document:
      host: ${DOCUMENT_COMPUTE_HOST:document-compute.usora.svc.cluster.local}
      port: 9091
    biometric:
      host: ${BIOMETRIC_COMPUTE_HOST:biometric-compute.usora.svc.cluster.local}
      port: 9092
    risk:
      host: ${RISK_COMPUTE_HOST:risk-compute.usora.svc.cluster.local}
      port: 9093

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.usora: INFO
    org.springframework: WARN
    org.hibernate: WARN
