server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/usora_notifications_dev
    username: usora_dev
    password: usora_dev_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    username:
    password:

security:
  # F-011: dev now points at identity-service's real JWKS endpoint (see
  # application.yml's default of http://identity.usora.svc.cluster.local,
  # overridden here for a local, non-cluster dev setup) instead of a
  # local HMAC secret -- consistent with core-service's application-dev.yml
  # convention. This does mean local development needs identity-service
  # actually running and reachable to get a usable token; that's already
  # true for every other JWKS-based service in this repo.
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://localhost:8081/oauth2/jwks
  encryption:
    # Local-development-only key, never used in prod/staging -- those
    # require ENCRYPTION_SECRET_KEY and fail startup without it.
    secret-key: bm90aWYtZGV2LWVuY3J5cHRpb24ta2V5LTMyYnl0ZXM=

notification:
  webhook:
    retry:
      max-attempts: 2
      initial-delay-ms: 500

logging:
  level:
    com.usora: DEBUG
    org.springframework: DEBUG
    org.hibernate.SQL: DEBUG
    org.apache.kafka: INFO

grpc:
  client:
    tenant-service:
      address: static://localhost:9090
      negotiation-type: plaintext
