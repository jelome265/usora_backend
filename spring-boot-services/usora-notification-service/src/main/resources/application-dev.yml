server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/usora_notifications_dev
    username: usora_dev
    password: usora_dev_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    username:
    password:

security:
  jwt:
    # Local-development-only signing key. Never used in prod/staging — those
    # profiles require the JWT_SECRET environment variable and fail startup
    # without it (see C-02 remediation in JwtTokenProvider).
    secret: dev-only-notification-jwt-secret-not-for-production-use-32chars
  encryption:
    # Local-development-only key, never used in prod/staging -- those
    # require ENCRYPTION_SECRET_KEY and fail startup without it.
    secret-key: bm90aWYtZGV2LWVuY3J5cHRpb24ta2V5LTMyYnl0ZXM=

notification:
  webhook:
    retry:
      max-attempts: 2
      initial-delay-ms: 500

logging:
  level:
    com.usora: DEBUG
    org.springframework: DEBUG
    org.hibernate.SQL: DEBUG
    org.apache.kafka: INFO

grpc:
  client:
    tenant-service:
      address: static://localhost:9090
      negotiation-type: plaintext
