server:
  port: 8085

spring:
  application:
    name: usora-notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/usora_notifications
    username: usora
    password: usora_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # SECURITY (F-010): "*" trusted every package on the classpath for
        # Spring Kafka's JsonDeserializer, which -- when a message header
        # names a type (see spring.json.use.type.headers below) -- will
        # instantiate whatever class the header claims, with no
        # restriction. The consumers of this deserializer
        # (DomainEventListener) only ever deserialize into
        # java.util.Map<String, Object> in practice -- there is no custom
        # event DTO type in play here at all. Rather than merely narrow
        # the trusted-package string to match that (which would still
        # leave header-driven type selection active), this pins every
        # message to LinkedHashMap unconditionally and stops honoring the
        # __TypeId__ header entirely -- removing the actual attack surface
        # (a message dictating what class to instantiate) rather than just
        # shrinking its blast radius.
        spring.json.trusted.packages: "java.util,java.lang"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    template:
      default-topic: notification.events

  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 10000
          connectiontimeout: 5000

kafka:
  topics:
    notification-events: notification.events
    compliance-alerts: compliance.alerts
    verification-results: verification.results

notification:
  webhook:
    retry:
      max-attempts: 3
      initial-delay-ms: 1000
      multiplier: 2.0
  cleanup:
    retention-days: 90
  async:
    core-pool-size: 10
    max-pool-size: 50

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
    instances:
      notificationDelivery:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
    instances:
      notificationRetry:
        base-config: default

grpc:
  client:
    tenant-service:
      address: static://localhost:9090
      negotiation-type: plaintext
  server:
    port: 9095

security:
  # F-011: replaced the HMAC-secret JWT verification (security.jwt.secret)
  # with the central identity-service's RS256/JWKS contract, the same one
  # core-service/audit-service/gateway trust -- see SecurityConfig for the
  # JwtDecoder wired against this. A token issued by identity-service could
  # not previously be validated here at all (wrong algorithm, wrong key
  # material); this service's own JWT_SECRET was a parallel credential
  # system with its own (nonexistent) rotation and no relationship to the
  # platform's actual token issuer.
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: ${JWK_SET_URI:http://identity.usora.svc.cluster.local:8080/oauth2/jwks}
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      service: usora-notification-service
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.usora: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: WARN
