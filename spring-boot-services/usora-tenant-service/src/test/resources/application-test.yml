spring:
  application:
    name: usora-tenant-service-test

  cache:
    type: none

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 16379
      timeout: 1000ms

  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: test-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9081/auth/jwks

server:
  port: 0

grpc:
  server:
    port: 0
  client:
    identity-service:
      host: localhost
      port: 0
    compliance-service:
      host: localhost
      port: 0

jwt:
  jwks-url: http://localhost:9081/auth/jwks

logging:
  level:
    com.usora: DEBUG
    org.springframework: WARN

tenant:
  provisioning:
    auto-approve: true
    schema-prefix: "test_tenant_"
    namespace-prefix: "test-tenant-"
    default-resource-quota:
      cpu: "2"
      memory: "4Gi"
      storage: "10Gi"
      pods: "10"
  offboarding:
    grace-period-days: 1
    purge-immediately: true
    gdpr-compliance: false
    audit-retention-years: 1
  billing:
    provider: "test"
    webhook-secret: "test-secret"
    usage-reporting-interval: "1h"
  suspension:
    auto-suspend-on-payment-failure: false
    auto-suspend-after-days: 1
    data-retention-during-suspension: "1d"
