spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      properties:
        spring.json.type.mapping: >
          tenantProvisioned:com.usora.tenant.event.DomainEventPublisher$TenantProvisionedEvent,
          tenantSuspended:com.usora.tenant.event.DomainEventPublisher$TenantSuspendedEvent,
          tenantOffboarded:com.usora.tenant.event.DomainEventPublisher$TenantOffboardedEvent

server:
  port: ${SERVER_PORT:8083}

grpc:
  server:
    port: ${GRPC_PORT:9090}
  client:
    identity-service:
      host: ${IDENTITY_SERVICE_HOST}
      port: ${IDENTITY_SERVICE_PORT}
    compliance-service:
      host: ${COMPLIANCE_SERVICE_HOST}
      port: ${COMPLIANCE_SERVICE_PORT}

jwt:
  jwks-url: ${JWKS_URI}

logging:
  level:
    com.usora: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
