spring:
  application:
    name: usora-tenant-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usora_tenant}
    username: ${DB_USERNAME:usora}
    password: ${DB_PASSWORD:usora}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: TenantPool

  flyway:
    enabled: true
    # C7 / RLS: migrations (CREATE TABLE, CREATE ROLE, GRANT) run as an
    # owner-equivalent role, kept entirely separate from
    # spring.datasource.* above, which is the restricted, RLS-subject
    # runtime role. See V3__row_level_security.sql /
    # TenantAwareDataSource.java.
    url: ${SPRING_FLYWAY_URL:${spring.datasource.url}}
    user: ${SPRING_FLYWAY_USER:${spring.datasource.username}}
    password: ${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          tenantProvisioned:com.usora.tenant.event.DomainEventPublisher$TenantProvisionedEvent,
          tenantSuspended:com.usora.tenant.event.DomainEventPublisher$TenantSuspendedEvent,
          tenantOffboarded:com.usora.tenant.event.DomainEventPublisher$TenantOffboardedEvent
    consumer:
      group-id: tenant-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.usora.tenant.event"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/auth/jwks}

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /

grpc:
  server:
    port: ${GRPC_PORT:9090}
  client:
    identity-service:
      host: ${IDENTITY_SERVICE_HOST:localhost}
      port: ${IDENTITY_SERVICE_PORT:9091}
    compliance-service:
      host: ${COMPLIANCE_SERVICE_HOST:localhost}
      port: ${COMPLIANCE_SERVICE_PORT:9092}

jwt:
  jwks-url: ${JWKS_URI:http://localhost:8081/auth/jwks}
  issuer: ${JWT_ISSUER:usora-platform}
  audience: ${JWT_AUDIENCE:usora-services}

tenant:
  provisioning:
    auto-approve: false
    schema-prefix: "tenant_"
    namespace-prefix: "tenant-"
    default-resource-quota:
      cpu: "10"
      memory: "20Gi"
      storage: "100Gi"
      pods: "50"
  offboarding:
    grace-period-days: 30
    purge-immediately: false
    gdpr-compliance: true
    audit-retention-years: 7
  billing:
    provider: "stripe"
    # PRE-EXISTING BUG, found and fixed while writing this service's Helm
    # chart: "${VAULT:stripe_webhook_secret}" is not a Vault reference —
    # Spring interpolates ${X:default} by looking for a property/env var
    # literally named X, so this read an env var literally named `VAULT`
    # and, failing that, silently fell back to the literal string
    # "stripe_webhook_secret" as the actual webhook secret used to verify
    # Stripe webhook signatures. Fixed to reference a real env var name
    # with no insecure literal fallback — see STRIPE_WEBHOOK_SECRET in
    # this chart's Deployment, sourced from a mandatory Secret.
    webhook-secret: "${STRIPE_WEBHOOK_SECRET:}"
    usage-reporting-interval: "1h"
  suspension:
    auto-suspend-on-payment-failure: true
    auto-suspend-after-days: 7
    data-retention-during-suspension: "90d"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.usora: ${LOG_LEVEL:INFO}
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{tenantId}] - %msg%n"

resilience4j:
  retry:
    instances:
      tenantProvisioning:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.sql.SQLException
          - org.springframework.dao.DataAccessException
