syntax = "proto3";

package usora.compliance;

option java_multiple_files = true;
option java_package = "com.usora.compliance.grpc";
option java_outer_classname = "ComplianceProto";

service ComplianceService {
  rpc ValidateCompliance(ComplianceValidationRequest) returns (ComplianceValidationResponse);
  rpc GetRegulatoryRules(RegulatoryRulesRequest) returns (RegulatoryRulesResponse);
  rpc UpdateRegulatoryRules(RegulatoryRulesUpdateRequest) returns (RegulatoryRulesUpdateResponse);
  rpc GenerateReport(ReportGenerationRequest) returns (ReportGenerationResponse);
  rpc GetAuditTrail(AuditTrailRequest) returns (AuditTrailResponse);
  rpc CheckJurisdictionCompliance(JurisdictionCheckRequest) returns (JurisdictionCheckResponse);
  rpc SubmitEvidence(EvidenceSubmissionRequest) returns (EvidenceSubmissionResponse);
}

message ComplianceValidationRequest {
  string case_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  map<string, string> entity_data = 4;
  repeated string jurisdictions = 5;
  repeated string watchlist_types = 6;
  bool include_adverse_media = 7;
  bool include_transaction_screening = 8;
}

message ComplianceValidationResponse {
  string validation_id = 1;
  string case_id = 2;
  string status = 3;
  string overall_decision = 4;
  repeated RuleResult rule_results = 5;
  repeated AmlScreeningResult aml_results = 6;
  repeated JurisdictionResult jurisdiction_results = 7;
  int32 total_violations = 8;
  int32 total_warnings = 9;
  string validated_at = 10;
  string validated_by = 11;
}

message RuleResult {
  string rule_id = 1;
  string rule_name = 2;
  string severity = 3;
  bool passed = 4;
  string message = 5;
  repeated string triggered_conditions = 6;
}

message AmlScreeningResult {
  string screening_id = 1;
  string list_name = 2;
  string list_type = 3;
  double match_score = 4;
  bool is_match = 5;
  string matched_name = 6;
  string category = 7;
  string risk_level = 8;
}

message JurisdictionResult {
  string jurisdiction = 1;
  bool compliant = 2;
  repeated string requirements_met = 3;
  repeated string requirements_failed = 4;
  string message = 5;
}

message RegulatoryRulesRequest {
  string jurisdiction = 1;
}

message RegulatoryRulesResponse {
  repeated RuleDefinition rules = 1;
  int32 total_rules = 2;
  string last_updated = 3;
  string version = 4;
}

message RuleDefinition {
  string rule_id = 1;
  string name = 2;
  string description = 3;
  string jurisdiction = 4;
  string category = 5;
  string severity = 6;
  string drl_content = 7;
  bool active = 8;
  int32 version = 9;
  string signed_by = 10;
  string effective_from = 11;
  string expires_at = 12;
}

message RegulatoryRulesUpdateRequest {
  string rule_id = 1;
  string name = 2;
  string description = 3;
  string jurisdiction = 4;
  string category = 5;
  string severity = 6;
  string drl_content = 7;
  bool active = 8;
  string effective_from = 9;
  string expires_at = 10;
  repeated string replace_rule_ids = 11;
  string officer_token = 12;
  string legal_token = 13;
}

message RegulatoryRulesUpdateResponse {
  string rule_id = 1;
  int32 new_version = 2;
  string status = 3;
  string signature_hash = 4;
  string updated_at = 5;
  string updated_by = 6;
  string message = 7;
}

message ReportGenerationRequest {
  string report_type = 1;
  string format = 2;
  string case_id = 3;
  string jurisdiction = 4;
  string start_date = 5;
  string end_date = 6;
  repeated string include_sections = 7;
  map<string, string> filters = 8;
  bool include_evidence = 9;
  bool include_audit_trail = 10;
}

message ReportGenerationResponse {
  string report_id = 1;
  string status = 2;
  string format = 3;
  string download_url = 4;
  string requested_at = 5;
  string completed_at = 6;
  string message = 7;
}

message AuditTrailRequest {
  string case_id = 1;
}

message AuditTrailResponse {
  string case_id = 1;
  string tenant_id = 2;
  repeated AuditEntry entries = 3;
  int32 total_entries = 4;
  string hash_chain_root = 5;
  bool integrity_verified = 6;
}

message AuditEntry {
  string entry_id = 1;
  string event_type = 2;
  string action = 3;
  string actor = 4;
  string tenant_id = 5;
  string description = 6;
  map<string, string> details = 7;
  string previous_hash = 8;
  string current_hash = 9;
  string timestamp = 10;
}

message JurisdictionCheckRequest {
  string case_id = 1;
  string entity_id = 2;
  string jurisdiction = 3;
  map<string, string> entity_attributes = 4;
  repeated string applicable_regulations = 5;
}

message JurisdictionCheckResponse {
  string check_id = 1;
  string jurisdiction = 2;
  bool overall_compliant = 3;
  repeated RegulationResult regulation_results = 4;
  repeated string required_actions = 5;
  repeated string recommendations = 6;
  string checked_at = 7;
  string checked_by = 8;
}

message RegulationResult {
  string regulation = 1;
  string status = 2;
  bool compliant = 3;
  repeated string requirements_met = 4;
  repeated string requirements_failed = 5;
  string description = 6;
}

message EvidenceSubmissionRequest {
  string case_id = 1;
  string evidence_type = 2;
  string content_hash = 3;
  bytes content = 4;
  string mime_type = 5;
  map<string, string> metadata = 6;
  repeated string tags = 7;
  bool require_notarization = 8;
}

message EvidenceSubmissionResponse {
  string evidence_id = 1;
  string case_id = 2;
  string status = 3;
  string storage_path = 4;
  string verification_hash = 5;
  string blockchain_transaction_id = 6;
  string submitted_at = 7;
  string message = 8;
}
