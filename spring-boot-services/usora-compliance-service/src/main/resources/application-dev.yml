server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/usora_compliance_dev
    username: dev_compliance_user
    password: dev_compliance_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          # F-011: this pointed at a stale Keycloak-style realm path
          # (".../auth/realms/usora-dev/protocol/openid-connect/certs")
          # that identity-service has never actually served -- this
          # service's tokens could never have been verified against the
          # real identity-service JWKS with this value. Also dropped
          # issuer-uri: Spring Boot's resourceserver auto-config uses it
          # both to auto-discover jwk-set-uri via OIDC discovery metadata
          # AND to validate the "iss" claim, but identity-service doesn't
          # serve a conforming .well-known/openid-configuration document
          # here -- relying on that auto-discovery working would be an
          # unverified assumption. Matches core-service/audit-service,
          # which use jwk-set-uri directly with no issuer enforcement.
          jwk-set-uri: http://localhost:8081/oauth2/jwks

compliance:
  aml-screening:
    host: localhost
    port: 9090
  security:
    rule-signing-secret: dev-rule-signing-secret-not-for-production-use-32chars
  schedule:
    watchlist-refresh: "0 */5 * * * *"
    report-generation: "0 0 */2 * * *"
    evidence-archival: "0 0 */6 * * *"
    sanctions-staleness: "0 */5 * * * *"

management:
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.usora.compliance: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.drools: DEBUG
