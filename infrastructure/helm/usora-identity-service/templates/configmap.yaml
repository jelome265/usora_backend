apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usora-identity-service.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-identity-service.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfile | quote }}

  # PRE-EXISTING GAP, found and fixed while writing this chart: see
  # values.yaml's grpcPort comment — the app's compiled-in default (50051)
  # doesn't match what usora-tenant-service expects (9091).
  GRPC_SERVER_PORT: {{ .Values.grpcPort | quote }}

  # C7 / RLS: no credentials in the URL — DATASOURCE_USERNAME/PASSWORD
  # (runtime role) and SPRING_FLYWAY_USER/PASSWORD (migration role) are
  # set separately in deployment.yaml from two distinct Secrets.
  DATASOURCE_URL: {{ printf "jdbc:postgresql://%s:%d/%s" .Values.postgresql.host (int .Values.postgresql.port) .Values.postgresql.database | quote }}

  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}

  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}

  OPA_URL: {{ .Values.opa.url | quote }}

  # See SecurityConfig/DomainService's oauth2Issuer()/issuer() -- no default,
  # this service refuses to start without it.
  OAUTH2_ISSUER: {{ .Values.oauth2Issuer | quote }}
