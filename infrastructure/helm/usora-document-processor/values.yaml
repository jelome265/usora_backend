replicaCount: 5

nameOverride: ""
fullnameOverride: ""

# Matches resources.requests.cpu below (1 concurrent OCR/ML job per
# requested core is a reasonable starting heuristic for this workload —
# tune based on real p99 latency and CPU saturation once in staging).
maxConcurrentJobs: 4

image:
  repository: usora/document-processor
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: usora-document-processor
  annotations:
    eks.amazonaws.com/role-arn: ""

podAnnotations:
  sidecar.istio.io/inject: "true"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  ports:
    # PRE-EXISTING GAP, found and fixed while writing this chart: this
    # only listed a "metrics" port and no gRPC port at all — the primary
    # way usora-core actually invokes this service (see
    # DocumentAnalysisServiceServer in main.rs) had no Service port
    # exposing it.
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP

postgresql:
  host: usora-postgresql
  port: 5432
  database: usora_documents
  # SECURITY: no literal credentials in this file — see the equivalent
  # note in the usora-core chart's values.yaml. This chart's deployment
  # template requires a real Secret and refuses to render without one;
  # the app's own compiled-in default (postgres://postgres:postgres@...)
  # must never be reachable outside local/dev.
  existingSecret: ""
  existingSecretUrlKey: "database-url"

redis:
  host: usora-redis
  port: 6379
  existingSecret: ""
  existingSecretPasswordKey: "password"

security:
  # SECURITY: closes an undocumented gap found while writing this chart —
  # the REST API (/api/v1/documents/*) took tenant_id from the request
  # body with no authentication at all. This chart requires a real Secret
  # here (see deployment.yaml's `required` guard) — the app itself also
  # now refuses to start without it (see config.rs::validate()).
  existingSecret: ""
  existingSecretJwtSecretKey: "internal-service-jwt-secret"

resources:
  requests:
    cpu: "4"
    memory: "8Gi"
  limits:
    cpu: "8"
    memory: "16Gi"

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 50
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 85

kafka:
  bootstrapServers: usora-kafka:9092
  consumerGroupId: usora-document-processor
  autoOffsetReset: earliest
  maxPollRecords: 100
  fetchMinBytes: 1024
  fetchMaxWaitMs: 500
  sessionTimeoutMs: 45000
  heartbeatIntervalMs: 3000
  maxPartitionFetchBytes: 10485760
  topics:
    input: document.process
    output: document.processed
    deadLetter: document.dead.letter
    retry: document.retry
  retryCount: 3
  retryBackoffMs: 1000

models:
  path: /models
  ocrModel: tesseract
  classifierModel: document-classifier.onnx
  extractorModel: field-extractor.onnx

tesseract:
  dataPath: /usr/share/tesseract-ocr/4.00/tessdata
  languages: "eng+spa+fra+deu+ara+zho"
  psm: 3
  oem: 3

tempStorage:
  enabled: true
  size: 100Gi
  # PRE-EXISTING GAP, found and fixed while writing this chart: a
  # storageClass field only makes sense for a PersistentVolumeClaim, but
  # this workload is scaled by a Deployment (up to 50 replicas via
  # autoscaling.maxReplicas below), not a StatefulSet — a Deployment has
  # no per-replica PVC mechanism, and a single shared PVC mounted
  # ReadWriteMany across up to 50 concurrently-scaling pods doing
  # temp-file OCR/ML scratch work is a correctness hazard (races on
  # shared temp paths), not a storage decision. This chart uses a
  # per-pod emptyDir instead — see deployment.yaml. storageClass is kept
  # here only so an operator who previously relied on it sees why it's
  # now unused, rather than the field silently vanishing.
  storageClass: "N/A — see comment above; this chart uses emptyDir, not a PVC"
  mountPath: /tmp/processing

readinessProbe:
  # PRE-EXISTING GAP, found and fixed while writing this chart: exec
  # probes calling /bin/grpc_health_probe require that binary to exist in
  # the container image. infrastructure/docker/Dockerfile.rust builds
  # onto gcr.io/distroless/cc-debian12, which has no shell and no extra
  # binaries beyond the compiled service itself — /bin/grpc_health_probe
  # was never going to exist there, so this probe would have failed
  # forever and every pod would have been killed on first liveness check.
  # The app already registers a real tonic-health gRPC service (see
  # main.rs) — using Kubernetes' native gRPC probe (stable since 1.27)
  # talks to that service directly with no extra binary needed at all.
  grpc:
    port: 9090
  initialDelaySeconds: 15
  periodSeconds: 10

livenessProbe:
  grpc:
    port: 9090
  initialDelaySeconds: 30
  periodSeconds: 30

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - usora-document-processor
        topologyKey: kubernetes.io/hostname
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-type
              operator: In
              values:
                - compute

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "compute"
    effect: "NoSchedule"

nodeSelector:
  node-type: compute
