apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usora-document-processor.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-document-processor.labels" . | nindent 4 }}
data:
  KAFKA_BROKERS: {{ .Values.kafka.bootstrapServers | quote }}
  KAFKA_GROUP_ID: {{ .Values.kafka.consumerGroupId | quote }}
  KAFKA_TASKS_TOPIC: {{ .Values.kafka.topics.input | quote }}
  KAFKA_RESULTS_TOPIC: {{ .Values.kafka.topics.output | quote }}
  KAFKA_DEAD_LETTER_TOPIC: {{ .Values.kafka.topics.deadLetter | quote }}
  KAFKA_RETRY_COUNT: {{ .Values.kafka.retryCount | quote }}
  KAFKA_RETRY_BACKOFF_MS: {{ .Values.kafka.retryBackoffMs | quote }}

  # PRE-EXISTING GAP, found and fixed while writing this chart: the app's
  # compiled-in default gRPC port is 50052 (see config/mod.rs), not 9090.
  # Standardizing explicitly on 9090 here to match every other service in
  # this fleet (usora-gateway, usora-core) rather than leaving this one
  # service on a different convention.
  GRPC_BIND_ADDRESS: "0.0.0.0:9090"
  REST_BIND_ADDRESS: "0.0.0.0:8080"

  REDIS_HOST: {{ .Values.redis.host | quote }}

  MODEL_PATH: {{ .Values.models.path | quote }}
  TESSDATA_PREFIX: {{ .Values.tesseract.dataPath | quote }}
  TEMP_DIR: {{ .Values.tempStorage.mountPath | quote }}
  MAX_CONCURRENT_JOBS: {{ .Values.maxConcurrentJobs | quote }}

  SERVICE_NAME: "usora-document-processor"
