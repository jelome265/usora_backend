apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "usora-face-matching-engine.fullname" . }}-inter-service-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-face-matching-engine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "usora-face-matching-engine.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.ports.grpc }}
          protocol: TCP
        - port: {{ .Values.ports.metrics }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: service
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: compute
