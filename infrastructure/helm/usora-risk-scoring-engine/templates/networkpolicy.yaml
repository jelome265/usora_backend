apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "usora-risk-scoring-engine.fullname" . }}-inter-service-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-risk-scoring-engine.labels" . | nindent 4 }}
spec:
  # Same reasoning as usora-document-processor's networkpolicy.yaml: the
  # base allow-inter-service rule only targets component=service, not
  # component=compute, so this chart ships its own ingress grant rather
  # than leave this service unreachable from usora-core under the
  # namespace's default-deny-all.
  podSelector:
    matchLabels:
      {{- include "usora-risk-scoring-engine.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9090
          protocol: TCP
        - port: 8080
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: service
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: compute
