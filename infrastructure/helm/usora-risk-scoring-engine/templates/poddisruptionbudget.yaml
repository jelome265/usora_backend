{{- if gt (int (.Values.autoscaling.minReplicas | default .Values.replicaCount)) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "usora-risk-scoring-engine.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-risk-scoring-engine.labels" . | nindent 4 }}
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      {{- include "usora-risk-scoring-engine.selectorLabels" . | nindent 6 }}
{{- end }}
