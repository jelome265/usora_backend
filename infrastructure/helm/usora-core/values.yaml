replicaCount: 3

image:
  repository: usora/core-service
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: usora-core
  annotations:
    eks.amazonaws.com/role-arn: ""

podAnnotations:
  sidecar.istio.io/inject: "true"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  host: usora-postgresql
  port: 5432
  database: usora_core
  poolMaxSize: 20
  poolMinIdle: 5
  connectionTimeout: 30000
  idleTimeout: 600000
  maxLifetime: 1800000

redis:
  host: usora-redis
  port: 6379
  password: ""
  timeout: 2000
  poolMaxTotal: 16
  poolMaxIdle: 8
  poolMinIdle: 2

kafka:
  bootstrapServers: usora-kafka:9092
  schemaRegistryUrl: http://usora-schema-registry:8081
  consumerGroupId: usora-core
  autoOffsetReset: earliest
  maxPollRecords: 500
  sessionTimeoutMs: 30000
  heartbeatIntervalMs: 3000
  topics:
    verificationRequest: verification.request
    verificationResult: verification.result
    documentProcessed: document.processed
    auditEvents: audit.events
    deadLetter: dead.letter

opentelemetry:
  enabled: true
  endpoint: http://usora-otel-collector:4318
  tracesSamplerRatio: 0.1
  metricsExportInterval: 60000

istio:
  enabled: true
  trafficManagement:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 1024
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - usora-core
          topologyKey: kubernetes.io/hostname

tolerations: []

nodeSelector: {}
