replicaCount: 3

nameOverride: ""
fullnameOverride: ""

springProfile: "prod"

image:
  repository: usora/core-service
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: usora-core
  annotations:
    eks.amazonaws.com/role-arn: ""

podAnnotations:
  sidecar.istio.io/inject: "true"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  host: usora-postgresql
  port: 5432
  database: usora_core
  poolMaxSize: 20
  poolMinIdle: 5
  connectionTimeout: 30000
  idleTimeout: 600000
  maxLifetime: 1800000
  # SECURITY: no literal credentials in this file, ever — see finding in
  # docs/USORA-BACKEND-ENTERPRISE-AUDIT-2026-08-16.md (§7). Must reference
  # a Secret provisioned by Vault/External Secrets Operator, not created
  # by this chart. application.yml's compiled-in fallback (username/
  # password both "usora") must never be reachable in any environment
  # that uses this chart — see the security.existingSecret requirement
  # below, which this chart's deployment template treats as mandatory.
  existingSecret: ""
  existingSecretUsernameKey: "username"
  existingSecretPasswordKey: "password"

redis:
  host: usora-redis
  port: 6379
  # SECURITY: leave empty and use existingSecret in any shared environment.
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "password"
  timeout: 2000
  poolMaxTotal: 16
  poolMaxIdle: 8
  poolMinIdle: 2

security:
  # SECURITY: application.yml falls back to a compiled-in, publicly
  # visible (git-committed) AES key
  # (usora.security.encryption-key: AAAAAAAAAAAAAAAAAAAAAA==) whenever
  # ENCRYPTION_KEY isn't set. That default must never be reachable outside
  # a throwaway local dev environment — this chart requires a real Secret
  # here and refuses to render without one (see deployment.yaml's
  # `required` guard). See finding pattern in
  # docs/USORA-BACKEND-ENTERPRISE-AUDIT-2026-08-16.md §7 ("Secrets ...
  # never in source, config files").
  existingSecret: ""
  existingSecretEncryptionKeyKey: "encryption-key"

identityService:
  # Matches the Service name usora-identity-service's own chart is
  # expected to produce (<release>-usora-identity-service via the same
  # fullname helper pattern as this chart) — override per environment if
  # the identity-service release uses a different name.
  serviceName: usora-identity-service
  port: 8081

compute:
  document:
    host: usora-document-processor
  biometric:
    host: usora-face-matching-engine
  risk:
    host: usora-risk-scoring-engine

kafka:
  bootstrapServers: usora-kafka:9092
  schemaRegistryUrl: http://usora-schema-registry:8081
  consumerGroupId: usora-core
  autoOffsetReset: earliest
  maxPollRecords: 500
  sessionTimeoutMs: 30000
  heartbeatIntervalMs: 3000
  topics:
    verificationRequest: verification.request
    verificationResult: verification.result
    documentProcessed: document.processed
    auditEvents: audit.events
    deadLetter: dead.letter

opentelemetry:
  enabled: true
  endpoint: http://usora-otel-collector:4318
  tracesSamplerRatio: 0.1
  metricsExportInterval: 60000

istio:
  enabled: true
  trafficManagement:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 1024
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - usora-core
          topologyKey: kubernetes.io/hostname

tolerations: []

nodeSelector: {}
