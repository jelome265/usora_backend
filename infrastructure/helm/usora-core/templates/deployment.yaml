apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "usora-core.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-core.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "usora-core.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "usora-core.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "usora-core.serviceAccountName" . }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Matches `USER 1000` in infrastructure/docker/Dockerfile.spring-boot.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: usora-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # The JVM writes class-data-sharing archives and JIT
            # scratch data under /tmp at runtime, not to the app
            # directory itself — readOnlyRootFilesystem is safe here as
            # long as /tmp stays writable (see the tmp volume below).
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "usora-core.fullname" . }}-config
          env:
            {{- if .Values.postgresql.runtimeRole.existingSecret }}
            # C7 / RLS: this is the RESTRICTED, RLS-subject role — see
            # V3__row_level_security.sql and TenantAwareDataSource.java.
            # Must NOT be the same role as migrationRole below.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.runtimeRole.existingSecret }}
                  key: {{ .Values.postgresql.runtimeRole.existingSecretUsernameKey | default "username" }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.runtimeRole.existingSecret }}
                  key: {{ .Values.postgresql.runtimeRole.existingSecretPasswordKey | default "password" }}
            {{- else }}
            {{ required "postgresql.runtimeRole.existingSecret must be set — the app falls back to its compiled-in default credentials (username/password both \"usora\") otherwise, which must never be reachable outside local/dev, and RLS depends on this role being genuinely restricted (see V3__row_level_security.sql)." "" }}
            {{- end }}
            {{- if .Values.postgresql.migrationRole.existingSecret }}
            # C7 / RLS: this is the OWNER-equivalent role used ONLY for
            # Flyway migrations (DDL) — never for normal request traffic.
            - name: SPRING_FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.migrationRole.existingSecret }}
                  key: {{ .Values.postgresql.migrationRole.existingSecretUsernameKey | default "username" }}
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.migrationRole.existingSecret }}
                  key: {{ .Values.postgresql.migrationRole.existingSecretPasswordKey | default "password" }}
            {{- else }}
            {{ required "postgresql.migrationRole.existingSecret must be set — without it, Flyway falls back to reusing spring.datasource.* (see application.yml), meaning migrations would run as the restricted runtime role and every DDL statement in V3__row_level_security.sql (CREATE ROLE, GRANT, CREATE POLICY) would fail with a permissions error at startup." "" }}
            {{- end }}
            {{- if .Values.redis.existingSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.existingSecretPasswordKey | default "password" }}
            {{- end }}
            {{- if .Values.security.existingSecret }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.existingSecret }}
                  key: {{ .Values.security.existingSecretEncryptionKeyKey | default "encryption-key" }}
            {{- else }}
            {{ required "security.existingSecret must be set — this environment's data-encryption key must never fall back to the compiled-in default in application.yml (usora.security.encryption-key). See docs/USORA-BACKEND-ENTERPRISE-AUDIT-2026-08-16.md §7." "" }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
