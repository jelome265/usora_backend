apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usora-audit-service.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-audit-service.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfile | quote }}

  DB_HOST: {{ .Values.postgresql.host | quote }}
  DB_PORT: {{ .Values.postgresql.port | quote }}
  DB_NAME: {{ .Values.postgresql.database | quote }}

  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}

  # NOTE: this service uses KAFKA_HOST/KAFKA_PORT (combined into
  # bootstrap-servers by application.yml), not KAFKA_BROKERS like most of
  # the rest of the fleet — a real cross-service naming inconsistency, but
  # fixing it means editing this service's application.yml, which is out
  # of scope for a chart-only pass; matching what this service actually
  # expects is what matters here.
  KAFKA_HOST: {{ .Values.kafka.host | quote }}
  KAFKA_PORT: {{ .Values.kafka.port | quote }}

  BLOCKCHAIN_GRPC_HOST: {{ .Values.blockchain.host | quote }}
  BLOCKCHAIN_GRPC_PORT: {{ .Values.blockchain.port | quote }}

  AWS_REGION: {{ .Values.s3.region | quote }}
  AWS_S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}

  {{- if .Values.siem.url }}
  # PRE-EXISTING GAP, found while writing this chart: spring.siem.url has
  # no ${...} placeholder in application.yml at all (unlike siem.token,
  # which does) — it's a plain hardcoded http://localhost:8088. Spring's
  # relaxed env-var binding still overrides it via SPRING_SIEM_URL
  # regardless.
  SPRING_SIEM_URL: {{ .Values.siem.url | quote }}
  {{- end }}
