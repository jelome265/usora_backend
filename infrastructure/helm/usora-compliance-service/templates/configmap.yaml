apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usora-compliance-service.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-compliance-service.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfile | quote }}

  COMPLIANCE_DB_HOST: {{ .Values.postgresql.host | quote }}

  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}

  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}

  JWT_ISSUER_URI: {{ printf "http://%s:%d" .Values.identityService.serviceName (int .Values.identityService.port) | quote }}
  JWK_SET_URI: {{ printf "http://%s:%d%s" .Values.identityService.serviceName (int .Values.identityService.port) .Values.identityService.jwksPath | quote }}

  AML_SCREENING_HOST: {{ .Values.amlScreening.host | quote }}
  AML_SCREENING_PORT: {{ .Values.amlScreening.port | quote }}
