apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usora-gateway.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-gateway.labels" . | nindent 4 }}
data:
  # These map 1:1 onto the env vars read by Config::from_env() in
  # rust-services/usora-api-gateway/src/config/mod.rs. Keep this list in
  # sync with that file — a value added there with no corresponding entry
  # here silently falls back to the compiled-in default in every
  # environment using this chart.
  BIND_ADDRESS: "0.0.0.0:8443"
  GRPC_BIND_ADDRESS: "0.0.0.0:9090"
  TLS_CERT_PATH: {{ .Values.tls.serverCert | quote }}
  TLS_KEY_PATH: {{ .Values.tls.serverKey | quote }}
  TLS_MIN_VERSION: {{ printf "TLSv%s" .Values.tls.minVersion | quote }}
  # Wires the previously-unused MtlsValidator (auth/mtls.rs) into the actual
  # TLS handshake -- see load_tls_config in config/mod.rs. tls.caCert has
  # been present in this chart's values.yaml since it was written but had
  # no consumer until now.
  TLS_REQUIRE_CLIENT_AUTH: {{ .Values.tls.requireClientAuth | default false | quote }}
  TLS_CLIENT_CA_PATH: {{ .Values.tls.caCert | quote }}
  REDIS_POOL_SIZE: {{ .Values.redis.poolMaxSize | quote }}
  KAFKA_BROKERS: {{ .Values.kafka.bootstrapServers | quote }}
  KAFKA_TOPIC_PREFIX: "usora"
  RATE_LIMIT_DEFAULT_RPS: {{ .Values.rateLimiting.default.requestsPerSecond | quote }}
  RATE_LIMIT_BURST_SIZE: {{ .Values.rateLimiting.default.burstSize | quote }}
  RATE_LIMIT_WINDOW_MS: "1000"
  # SECURITY: never defaults to a wildcard — see finding C5 in
  # docs/USORA-BACKEND-ENTERPRISE-AUDIT-2026-08-16.md. This chart requires
  # an explicit, environment-specific origin list; an empty list here means
  # no cross-origin browser access is permitted (server-to-server callers
  # are unaffected). Set corsAllowedOrigins in this environment's values
  # override — do not leave it empty in a real deployment unless the API
  # genuinely has no browser-based caller.
  CORS_ALLOWED_ORIGINS: {{ join "," .Values.corsAllowedOrigins | quote }}
  UPSTREAM_ORCHESTRATOR_URL: {{ printf "https://%s:%d" .Values.upstream.orchestrator.host (int .Values.upstream.orchestrator.grpcPort) | quote }}
  UPSTREAM_COMPUTE_URL: {{ printf "https://%s:%d" .Values.upstream.compute.host (int .Values.upstream.compute.grpcPort) | quote }}
  # SECURITY: closes the gap where these URLs said "https://" but
  # GrpcClients::connect never configured any TLS transport for them at
  # all (see grpc/mod.rs). Same CA this pod already mounts for its own
  # inbound TLS (see the tls-certs volume below) -- the orchestrator and
  # compute upstreams are provisioned from the same cert-manager issuer.
  UPSTREAM_TLS_CA_PATH: "/etc/tls/ca.crt"
  OTLP_ENDPOINT: {{ .Values.observability.otlpEndpoint | quote }}
  SERVICE_NAME: "usora-api-gateway"
  IDENTITY_JWKS_URL: {{ printf "http://%s:%d/oauth2/jwks" .Values.identity.host (int .Values.identity.port) | quote }}
  # SECURITY: must match usora-identity-service's own OAUTH2_ISSUER value
  # exactly (see that chart's values), or every token this gateway sees will
  # be rejected on issuer mismatch. Deliberately built from the same
  # identity.host/port values as IDENTITY_JWKS_URL above rather than set
  # independently, so the two can't silently drift apart in this chart --
  # any real mismatch has to come from identity-service's own OAUTH2_ISSUER
  # being set to something other than this host:port (e.g. behind an
  # ingress with a public hostname), which then needs an explicit override
  # here too.
  JWT_ISSUER: {{ printf "http://%s:%d" .Values.identity.host (int .Values.identity.port) | quote }}
  JWKS_REFRESH_SECS: {{ .Values.identity.jwksRefreshSeconds | quote }}
