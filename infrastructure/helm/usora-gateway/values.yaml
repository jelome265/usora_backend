replicaCount: 5

nameOverride: ""
fullnameOverride: ""

image:
  repository: usora/api-gateway
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: usora-gateway
  annotations:
    eks.amazonaws.com/role-arn: ""

podAnnotations:
  sidecar.istio.io/inject: "true"
  prometheus.io/scrape: "true"
  # PRE-EXISTING GAP, found and fixed while writing this chart: /metrics
  # is served on the HTTPS port (8443) by the same axum router as
  # everything else (see routes/mod.rs — there is no separate metrics
  # listener), not on 9090 (which is a gRPC-only tonic server and cannot
  # serve a Prometheus text-exposition response at all). The previous
  # value here would have made every scrape attempt fail.
  # NOTE: the cluster's allow-metrics-ingress NetworkPolicy
  # (infrastructure/k8s/base/network-policies.yml) currently only opens
  # ingress on port 8080 for the prometheus/monitoring namespaces — it does
  # not cover this port (8443) or this scrape needing a TLS-aware
  # Prometheus scrape config (scheme: https). Both need to be reconciled
  # before scraping will actually work end-to-end; flagging here rather
  # than silently editing the shared base NetworkPolicy for every service.
  prometheus.io/port: "8443"
  prometheus.io/scheme: "https"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP

tls:
  enabled: true
  certManager:
    issuer: usora-platform-issuer
    certificateName: usora-gateway-tls
  serverCert: /etc/tls/server.crt
  serverKey: /etc/tls/server.key
  caCert: /etc/tls/ca.crt
  minVersion: "1.3"
  cipherSuites:
    - TLS_AES_128_GCM_SHA256
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256

resources:
  requests:
    cpu: "1"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

redis:
  host: usora-redis
  port: 6379
  # SECURITY: leave this empty and use existingSecret in any shared
  # environment — do not set a literal password here. See finding in
  # docs/USORA-BACKEND-ENTERPRISE-AUDIT-2026-08-16.md (§7) re: secrets
  # sourced only from a vault/KMS/secrets manager.
  password: ""
  # Name of a pre-existing Secret (provisioned by Vault/External Secrets
  # Operator, not by this chart) containing the Redis password.
  existingSecret: ""
  existingSecretPasswordKey: "password"
  timeout: 2000
  poolMaxSize: 64
  poolMaxIdle: 32
  poolMinIdle: 8

kafka:
  bootstrapServers: usora-kafka:9092
  producer:
    acks: all
    compressionType: snappy
    lingerMs: 5
    batchSize: 16384
  topics:
    auditEvents: audit.events
    rateLimitExceeded: rate.limit.exceeded

upstream:
  orchestrator:
    host: usora-core
    grpcPort: 9090
    httpPort: 8080
    timeoutMs: 30000
    maxRetries: 3
    circuitBreaker:
      failureThreshold: 10
      successThreshold: 5
      halfOpenMaxRequests: 3
      openDurationMs: 30000
  compute:
    host: usora-document-processor
    grpcPort: 9090
    timeoutMs: 60000
    maxRetries: 2
    circuitBreaker:
      failureThreshold: 5
      successThreshold: 3
      halfOpenMaxRequests: 2
      openDurationMs: 15000

rateLimiting:
  enabled: true
  default:
    requestsPerSecond: 100
    burstSize: 200
  perTenant:
    enabled: true
    redisPrefix: "ratelimit:"
  global:
    requestsPerSecond: 10000
    burstSize: 20000

# SECURITY: explicit per-environment CORS origin allowlist consumed by
# CORS_ALLOWED_ORIGINS (see finding C5 in
# docs/USORA-BACKEND-ENTERPRISE-AUDIT-2026-08-16.md). Left empty by
# default so a fresh environment fails closed (no cross-origin browser
# access) rather than open. Override per environment, e.g.:
#   corsAllowedOrigins:
#     - https://app.usora.example
#     - https://dashboard.usora.example
corsAllowedOrigins: []

observability:
  otlpEndpoint: "http://usora-otel-collector:4317"

readinessProbe:
  # PRE-EXISTING GAP, found and fixed while writing this chart: the
  # application has no HTTP /health/ready or /health/live path anywhere —
  # see rust-services/usora-api-gateway/src/routes/health.rs (only
  # `/health` exists, on the HTTPS port) and src/main.rs::serve_grpc
  # (registers a real gRPC health-checking-protocol service via
  # tonic-health on port 9090). Using the httpGet probes that were here
  # previously would have made every pod permanently fail readiness/
  # liveness checks. Native Kubernetes gRPC probes (stable since 1.27)
  # point at the service the app actually implements.
  grpc:
    port: 9090
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

livenessProbe:
  grpc:
    port: 9090
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - usora-gateway
          topologyKey: topology.kubernetes.io/zone

tolerations: []

nodeSelector: {}
