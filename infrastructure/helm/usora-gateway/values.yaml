replicaCount: 5

image:
  repository: usora/api-gateway
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: usora-gateway
  annotations:
    eks.amazonaws.com/role-arn: ""

podAnnotations:
  sidecar.istio.io/inject: "true"
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP

tls:
  enabled: true
  certManager:
    issuer: usora-platform-issuer
    certificateName: usora-gateway-tls
  serverCert: /etc/tls/server.crt
  serverKey: /etc/tls/server.key
  caCert: /etc/tls/ca.crt
  minVersion: "1.3"
  cipherSuites:
    - TLS_AES_128_GCM_SHA256
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256

resources:
  requests:
    cpu: "1"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

redis:
  host: usora-redis
  port: 6379
  password: ""
  timeout: 2000
  poolMaxSize: 64
  poolMaxIdle: 32
  poolMinIdle: 8

kafka:
  bootstrapServers: usora-kafka:9092
  producer:
    acks: all
    compressionType: snappy
    lingerMs: 5
    batchSize: 16384
  topics:
    auditEvents: audit.events
    rateLimitExceeded: rate.limit.exceeded

upstream:
  orchestrator:
    host: usora-core
    grpcPort: 9090
    httpPort: 8080
    timeoutMs: 30000
    maxRetries: 3
    circuitBreaker:
      failureThreshold: 10
      successThreshold: 5
      halfOpenMaxRequests: 3
      openDurationMs: 30000
  compute:
    host: usora-document-processor
    grpcPort: 9090
    timeoutMs: 60000
    maxRetries: 2
    circuitBreaker:
      failureThreshold: 5
      successThreshold: 3
      halfOpenMaxRequests: 2
      openDurationMs: 15000

rateLimiting:
  enabled: true
  default:
    requestsPerSecond: 100
    burstSize: 200
  perTenant:
    enabled: true
    redisPrefix: "ratelimit:"
  global:
    requestsPerSecond: 10000
    burstSize: 20000

readinessProbe:
  httpGet:
    path: /health/ready
    port: 9090
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

livenessProbe:
  httpGet:
    path: /health/live
    port: 9090
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - usora-gateway
          topologyKey: topology.kubernetes.io/zone

tolerations: []

nodeSelector: {}
