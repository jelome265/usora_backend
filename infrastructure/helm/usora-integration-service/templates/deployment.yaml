apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "usora-integration-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "usora-integration-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "usora-integration-service.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "usora-integration-service.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "usora-integration-service.serviceAccountName" . }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: usora-integration-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
            - name: grpc
              containerPort: 9095
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "usora-integration-service.fullname" . }}-config
          env:
            {{- if .Values.postgresql.runtimeRole.existingSecret }}
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.runtimeRole.existingSecret }}
                  key: {{ .Values.postgresql.runtimeRole.existingSecretUsernameKey | default "username" }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.runtimeRole.existingSecret }}
                  key: {{ .Values.postgresql.runtimeRole.existingSecretPasswordKey | default "password" }}
            {{- else }}
            {{ required "postgresql.runtimeRole.existingSecret must be set — this is the restricted role RLS depends on (see V3__row_level_security.sql)." "" }}
            {{- end }}
            {{- if .Values.postgresql.migrationRole.existingSecret }}
            - name: SPRING_FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.migrationRole.existingSecret }}
                  key: {{ .Values.postgresql.migrationRole.existingSecretUsernameKey | default "username" }}
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.migrationRole.existingSecret }}
                  key: {{ .Values.postgresql.migrationRole.existingSecretPasswordKey | default "password" }}
            {{- else }}
            {{ required "postgresql.migrationRole.existingSecret must be set — without it Flyway reuses the restricted runtime role and every DDL statement in V3__row_level_security.sql fails." "" }}
            {{- end }}
            {{- if .Values.redis.existingSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.existingSecretPasswordKey | default "password" }}
            {{- else }}
            {{ required "redis.existingSecret must be set — REDIS_PASSWORD has no default in application-prod.yml." "" }}
            {{- end }}
            {{- if .Values.secrets.existingSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: encryption-key
            {{- else }}
            {{ required "secrets.existingSecret must be set — JWT_SECRET and ENCRYPTION_KEY were both missing from application-prod.yml's overrides before this chart (see values.yaml comment); neither has a safe default." "" }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
