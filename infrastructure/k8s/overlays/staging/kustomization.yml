apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: usora-platform
namePrefix: staging-

commonLabels:
  environment: staging
  managed-by: kustomize
  app.kubernetes.io/environment: staging

replicas:
  - name: usora-gateway
    count: 2
  - name: usora-core
    count: 2
  - name: usora-document-processor
    count: 3

resources:
  - ../../base

configMapGenerator:
  - name: gateway-config
    behavior: replace
    literals:
      - LOG_LEVEL=info
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_DEFAULT_RPS=500
      - TLS_ENABLED=true
      - OTEL_ENABLED=true
      - OTEL_TRACES_SAMPLER_RATIO=0.5
  - name: core-config
    behavior: replace
    literals:
      - LOG_LEVEL=info
      - SPRING_PROFILES_ACTIVE=staging
      - KAFKA_AUTO_OFFSET_RESET=latest
  - name: document-processor-config
    behavior: replace
    literals:
      - LOG_LEVEL=info
      - RUST_LOG=info
      - KAFKA_AUTO_OFFSET_RESET=latest
      - MODEL_PATH=s3://usora-models-staging/

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: usora-gateway
    spec:
      template:
        spec:
          containers:
            - name: usora-gateway
              resources:
                requests:
                  cpu: "1"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "1Gi"
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: usora-core
    spec:
      template:
        spec:
          containers:
            - name: usora-core
              resources:
                requests:
                  cpu: "1"
                  memory: "2Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: usora-document-processor
    spec:
      template:
        spec:
          containers:
            - name: usora-document-processor
              resources:
                requests:
                  cpu: "2"
                  memory: "4Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
  - |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: usora-gateway
    spec:
      minReplicas: 2
      maxReplicas: 10
  - |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: usora-core
    spec:
      minReplicas: 2
      maxReplicas: 5
  - |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: usora-document-processor
    spec:
      minReplicas: 3
      maxReplicas: 15
  - |-
    apiVersion: networking.istio.io/v1beta1
    kind: VirtualService
    metadata:
      name: gateway-ingress
    spec:
      gateways:
        - istio-system/staging-gateway
  - |-
    apiVersion: networking.istio.io/v1beta1
    kind: DestinationRule
    metadata:
      name: usora-gateway
    spec:
      trafficPolicy:
        tls:
          mode: ISTIO_MUTUAL
        connectionPool:
          tcp:
            maxConnections: 100
          http:
            http1MaxPendingRequests: 1024
            maxRequestsPerConnection: 10
        outlierDetection:
          consecutive5xxErrors: 3
          interval: 30s
          baseEjectionTime: 30s
          maxEjectionPercent: 30
