[package]
name = "usora-face-matching-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
# Added to close an undocumented gap found while writing this service's
# Helm chart: no gRPC health service was registered anywhere.
tonic-health = "0.12"
prost = "0.13"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
imageproc = "0.25"
tract-onnx = "0.23"
ndarray = "0.16"
ndarray-stats = "0.6"
opencv = "0.100"
faiss = "0.12"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
rdkafka = { version = "0.39", features = ["cmake-build"] }
redis = { version = "1.6", features = ["tokio-comp"] }
opentelemetry = { version = "0.25", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["trace", "metrics", "grpc-tonic"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.13", features = ["process"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
rayon = "1.10"
async-trait = "0.1"
bytes = "1"
base64 = "0.22"
approx = "0.5"
lazy_static = "1"
blake3 = "1.5"
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "throughput"
harness = false
