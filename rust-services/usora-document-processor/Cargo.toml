[package]
name = "usora-document-processor"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
tonic-health = "0.12"
tonic-reflection = "0.14"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
image = "0.25"
imageproc = "0.25"
tesseract = "0.15"
tract-onnx = "0.21"
ndarray = "0.16"
opencv = "0.91"
pdf = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
rdkafka = { version = "0.36", features = ["cmake-build"] }
redis = { version = "1.6", features = ["tokio-comp"] }
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "metrics", "grpc-tonic"] }
tracing = "0.1"
tracing-opentelemetry = "0.27"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.14", features = ["process"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
rayon = "1.10"
async-trait = "0.1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rxing = "0.9"
lazy_static = "1"
strum = { version = "0.28", features = ["derive"] }
axum = "0.8"
# Added to close an undocumented gap found while writing this service's
# Helm chart: the REST router in routes/mod.rs took `tenant_id` directly
# from the request body with no authentication at all, on endpoints that
# perform document/biometric forensic analysis. See auth.rs.
jsonwebtoken = "10"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
rand = "0.8"

[[bench]]
name = "throughput"
harness = false
