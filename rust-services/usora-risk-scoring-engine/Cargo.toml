[package]
name = "usora-risk-scoring-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
# Added to close an undocumented gap found while writing this service's
# Helm chart: no gRPC health service was registered anywhere, unlike the
# rest of the Rust fleet (gateway, document-processor) — a native
# Kubernetes gRPC readiness/liveness probe against this service had
# nothing to talk to and would fail every check.
tonic-health = "0.14"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Added for dead-letter-topic payload encoding — see KafkaConfig::dead_letter_topic.
base64 = "0.22"
serde_yaml = "0.9"
tract-onnx = "0.21"
ndarray = "0.16"
ndarray-stats = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
rdkafka = { version = "0.39", features = ["cmake-build"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = "0.27"
opentelemetry-semantic-conventions = "0.32"
thiserror = "2"
anyhow = "1"
rayon = "1"
async-trait = "0.1"
bytes = "1"
dashmap = "6"
parking_lot = "0.12"
rhai = { version = "1.19", features = ["sync"] }
petgraph = "0.8"
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
futures = "0.3"
lru = "0.12"
arc-swap = "1"
humantime-serde = "1"
schemars = { version = "0.8", features = ["chrono", "uuid"] }
hex = "0.4"
sha2 = "0.10"
derivative = "2"

[build-dependencies]
tonic-build = "0.14"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
rand = "0.8"
tempfile = "3"

[[bench]]
name = "throughput"
harness = false
